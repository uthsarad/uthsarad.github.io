    <script>
      // Honor motion preferences before the prerendered background can animate.
      ;(() => {
        let paused = false
        try {
          paused = localStorage.getItem('portfolio:motion-paused') === 'true'
        } catch {}
        document.documentElement.dataset.motion =
          paused || matchMedia('(prefers-reduced-motion: reduce)').matches
            ? 'off'
            : 'on'
        // A decorative arrival, not a gate on page content or the physical renderer.
        // Hash destinations and restored pages must remain immediately visible.
        if (
          document.documentElement.dataset.motion === 'on' &&
          location.pathname === '/' &&
          !location.hash &&
          performance.getEntriesByType('navigation')[0]?.type !== 'back_forward' &&
          performance.now() < 1600
        ) {
          document.documentElement.dataset.arrival = 'on'
          const finish = () => delete document.documentElement.dataset.arrival
          // A hard navigation-relative deadline also skips a late-loading stylesheet.
          setTimeout(finish, Math.max(0, 1600 - performance.now()))
          addEventListener('pagehide', finish, { once: true })
          addEventListener('pointerdown', finish, { once: true, capture: true })
          addEventListener('keydown', finish, { once: true, capture: true })
          addEventListener('wheel', finish, { once: true, passive: true })
        }
      })()
    </script>
    <style>
      /* Critical and self-expiring: no script, font, image or renderer needs to finish. */
      .space-arrival { display: none; opacity: 0; visibility: hidden; }
      html[data-arrival='on'] .space-arrival {
        position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
        pointer-events: none; color: #f5f7fb;
        background: #02040a;
        animation: arrival-exit 1250ms ease both;
      }
      .space-arrival__signal { width: min(280px, 68vw); margin: 0; text-align: center; }
      .space-arrival__signal svg { display: block; width: 100%; overflow: visible; }
      .space-arrival__orbit { transform-origin: 160px 100px; animation: arrival-orbit 1000ms ease-out both; }
      .space-arrival__signal figcaption {
        margin-top: 18px; color: #b4bcc9; font: 11px/1.5 ui-monospace, monospace;
        letter-spacing: .24em;
      }
      html:has(:focus-visible) .space-arrival,
      html:has(.navigation-drawer[open]) .space-arrival,
      html[data-motion='off'] .space-arrival { display: none; }
      /* Avoid expensive decorative compositing beneath the brief opaque arrival. */
      html[data-arrival='on'] .ambient-background,
      html[data-arrival='on'] .hero-grid { visibility: hidden; }
      html[data-arrival='on'] .side-navigation { backdrop-filter: none; }
      @keyframes arrival-exit {
        0%, 64% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      @keyframes arrival-orbit {
        from { transform: rotate(-14deg) scale(.9); opacity: .4; }
        to { transform: rotate(4deg) scale(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { .space-arrival { display: none !important; } }
    </style>
